name: Build, Discord & Modrinth Release

on:
  push:
    tags: [ "*" ]

env:
  DISCORD_COBBLEMON: ${{ secrets.DISCORD_COBBLEMON }}
  DISCORD_ZONARY123: ${{ secrets.DISCORD_ZONARY123 }}
  MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  full-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set project info
        id: set-info
        run: |
          TAG="${{ github.ref_name }}"
          MOD_NAME=$(grep '^mod_name=' gradle.properties | cut -d'=' -f2)
          MOD_VERSION=$(grep '^mod_version=' gradle.properties | cut -d'=' -f2)
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "MOD_NAME=$MOD_NAME" >> $GITHUB_ENV
          echo "MOD_VERSION=$MOD_VERSION" >> $GITHUB_ENV

      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - uses: gradle/actions/setup-gradle@v4

      - run: chmod +x ./gradlew

      - uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Build mod
        run: ./gradlew build remapJar --no-daemon

      - name: Create GitHub Release
        run: |
          gh release create "$TAG" fabric/build/libs/*.jar neoforge/build/libs/*.jar \
            --title "Release $TAG" \
            --notes "Automated release for version $TAG"

      - name: Send Discord Notifications
        run: |
          FABRIC_FILE=$(ls fabric/build/libs/*.jar | grep -v "sources" | grep -v "dev-shadow" | head -n1)
          NEOFORGE_FILE=$(ls neoforge/build/libs/*.jar | grep -v "sources" | grep -v "dev-shadow" | head -n1)

          # Extraer changelog
          BASE=$(echo "$TAG" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          CHANGELOG_CONTENT=$(tr -d '\r' < CHANGELOG.md | awk -v ver="$BASE" '
            $0 ~ "## \\[" ver "\\]" {flag=1; next}
            /^## \[/ && flag {flag=0}
            flag {print}
          ')

          if [ -z "$CHANGELOG_CONTENT" ]; then
            CHANGELOG_CONTENT="Automated release for version $TAG"
          fi

          CHANGELOG_FILE="build/changelog_${TAG}.txt"
          CHANGELOG_LEN=${#CHANGELOG_CONTENT}
          HAS_CHANGELOG_FILE=false

          mkdir -p build

          # Discord embed description limit: 4096 caracteres
          if [ "$CHANGELOG_LEN" -gt 3800 ]; then
            printf "%s\n" "$CHANGELOG_CONTENT" > "$CHANGELOG_FILE"
            TRUNCATED=$(printf "%s" "$CHANGELOG_CONTENT" | head -c 3500)
            EMBED_DESC=$(printf "%s\n\n📄 **Full changelog attached as a file...**" "$TRUNCATED")
            HAS_CHANGELOG_FILE=true
          else
            EMBED_DESC="$CHANGELOG_CONTENT"
          fi

          # Generar JSON embed correctamente escapado
          JSON_PAYLOAD=$(jq -nc --arg tag "$TAG" --arg changelog "$EMBED_DESC" \
            '{content: "@everyone 🎉 New Release!
            If you want contribute to the project, feel free to check the code on:
            [GitHub Repository](<https://github.com/zonary123/CobblemonPatches>)
            Here you have a list of optimization mods. It is recommended to have them on the server.
            [ScalableLux](<https://modrinth.com/mod/scalablelux>)
            [Lithium](<https://modrinth.com/mod/lithium>)
            [Krypton](<https://modrinth.com/mod/krypton>)
            [Alternate Current](<https://modrinth.com/mod/alternate-current>)
            [FerriteCore](<https://modrinth.com/mod/ferrite-core>)
            Protection mods:
            [Panda Anti-Dupe](<https://modrinth.com/mod/pandaantidupe>)",
          embeds:[{title:("Release "+$tag), description:$changelog,
          color:3066993}]}')

          echo "Embed JSON:"
          echo "$JSON_PAYLOAD"

          send_discord() {
            local WEBHOOK="$1"
            if [ -z "$WEBHOOK" ]; then
              return 0
            fi

            # 1️⃣ Enviar primero el embed
            curl -s -X POST "$WEBHOOK" \
              -H "Content-Type: application/json" \
              -d "$JSON_PAYLOAD"

            # 2️⃣ Si el changelog es extenso, enviar el archivo de texto
            if [ "$HAS_CHANGELOG_FILE" = true ] && [ -f "$CHANGELOG_FILE" ]; then
              curl -s -X POST "$WEBHOOK" \
                -F "file=@${CHANGELOG_FILE}"
            fi

            # 3️⃣ Enviar archivo Fabric
            if [ -n "$FABRIC_FILE" ] && [ -f "$FABRIC_FILE" ]; then
              curl -s -X POST "$WEBHOOK" \
                -F "file=@${FABRIC_FILE}"
            fi

            # 4️⃣ Enviar archivo NeoForge
            if [ -n "$NEOFORGE_FILE" ] && [ -f "$NEOFORGE_FILE" ]; then
              curl -s -X POST "$WEBHOOK" \
                -F "file=@${NEOFORGE_FILE}"
            fi
          }

          send_discord "$DISCORD_COBBLEMON"
          send_discord "$DISCORD_ZONARY123"


