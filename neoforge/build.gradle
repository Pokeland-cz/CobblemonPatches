plugins {
    id "com.gradleup.shadow" version "8.3.5"
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common
    shadowCommon
    common.canBeResolved = true
    common.canBeConsumed = false
    shadowCommon.canBeResolved = true
    shadowCommon.canBeConsumed = false
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
}

loom {
}

dependencies {
    neoForge "net.neoforged:neoforge:${rootProject.neoforge_version}"
    modImplementation "dev.architectury:architectury-neoforge:${rootProject.architectury_version}"
    modImplementation "com.cobblemon:neoforge:${rootProject.cobblemon_version}"

    common(project(path: ":common", configuration: "namedElements")) { transitive false }
    shadowCommon(project(path: ":common", configuration: "transformProductionNeoForge")) { transitive false }
}

processResources {
    var properties = [
        "mod_id"           : rootProject.mod_id,
        "mod_name"         : rootProject.mod_name,
        "mod_version"      : version,
        "mod_description"  : rootProject.mod_description,
        "author"           : rootProject.author,
        "license"          : rootProject.license,
        "neoforge_version" : rootProject.neoforge_version,
        "minecraft_version": rootProject.minecraft_version
    ]
    for (property in properties) {
        inputs.property property.key, property.value
    }
    filteringCharset = "UTF-8"

    filesMatching("META-INF/neoforge.mods.toml") {
        expand properties
    }
}

shadowJar {
    exclude "fabric.mod.json"
    exclude "architectury.common.json"
    configurations = [project.configurations.shadowCommon]
    archiveClassifier = "dev-shadow"
}

remapJar {
    inputFile.set shadowJar.archiveFile
    dependsOn shadowJar
    archiveClassifier = null
}

jar {
    archiveClassifier = "dev"
}

sourcesJar {
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}
